name: CodeQL Security Scan

permissions:
  contents: read          # Базовое разрешение для чтения кода
  security-events: write  # Это разрешение нужно CodeQL для загрузки результатов
  
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1'  # Каждый понедельник в 3:00

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        queries: security-and-quality
    
    - name: Build
      run: dotnet build ./steamHoursLinux/steamHoursLinux.csproj -c Release
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"